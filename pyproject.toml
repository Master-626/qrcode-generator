[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qrcode-generator"
version = "0.1.0"
description = "A QR code generator with batch support and WiFi QR code generation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["qrcode", "cli", "generator", "wifi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
    "qrcode[pil]>=7.4",
    "Pillow>=9.0.0",
]

[project.scripts]
qrgen = "qrcode_generator.cli:main"
qrcode-generator = "qrcode_generator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/qrcode-generator"
Repository = "https://github.com/Master-626/qrcode-generator"
Issue-Tracker = "https://github.com/Master-626/qrcode-generator/issues"
