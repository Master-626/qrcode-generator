[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qrcode-generator"
version = "0.1.1"
description = "Generate PNG QR codes for text, URLs, and Wi-Fi from a CLI or Python"
readme = "README.md"
# Pillow 13 (pulled in by qrcode[pil]) requires Python 3.11.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["qrcode", "cli", "generator", "wifi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
    "qrcode[pil]>=7.4",
    "Pillow>=9.0.0",
]

[project.scripts]
qrgen = "qrcode_generator.cli:main"
qrcode-generator = "qrcode_generator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6.0",
]
decode-test = [
    "zxing-cpp>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/qrcode-generator"
Repository = "https://github.com/Master-626/qrcode-generator"
Issue-Tracker = "https://github.com/Master-626/qrcode-generator/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "validation"]

[tool.ruff.lint]
select = ["E", "F", "I"]
